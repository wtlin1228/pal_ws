<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 260' width='760' height='260' role='img' aria-label='Double-pick risk' font-family='Roboto, Helvetica, Arial, sans-serif' font-size='13'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8b9499'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#646d72'/></marker></defs>
<rect width='760' height='260' fill='white'/>
<text x='24' y='28' font-size='15' text-anchor='start' font-weight='600' fill='#1d2326'>A 0.25 m pad on a 0.20 m box overhangs its neighbors: the double-pick risk</text>
<rect x='130.0' y='114.0' width='120' height='72' rx='3' fill='#e76125' fill-opacity='0.14' stroke='#e76125' stroke-width='1.25'/>
<rect x='140' y='120' width='100' height='60' rx='2' fill='none' stroke='#8b9499' stroke-width='2' stroke-dasharray='6 4'/>
<text x='140' y='114' font-size='11.5' text-anchor='start' font-weight='400' fill='#646d72'>pad (dashed)</text>
<text x='190' y='206' font-size='13' text-anchor='middle' font-weight='400' fill='#1d2326'>A box 0.30 × 0.18 under a 0.25 × 0.15 pad</text>
<text x='190' y='226' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>risk 0.00: the pad stays on the top face</text>
<rect x='416.0' y='110.0' width='80' height='80' rx='3' fill='#e76125' fill-opacity='0.14' stroke='#e76125' stroke-width='1.25'/>
<rect x='500.0' y='110.0' width='80' height='80' rx='3' fill='#e76125' fill-opacity='0.14' stroke='#e76125' stroke-width='1.25'/>
<rect x='584.0' y='110.0' width='80' height='80' rx='3' fill='#e76125' fill-opacity='0.14' stroke='#e76125' stroke-width='1.25'/>
<rect x='490' y='120' width='6' height='60' fill='#d21419' fill-opacity='0.55'/>
<rect x='584' y='120' width='6' height='60' fill='#d21419' fill-opacity='0.55'/>
<rect x='490' y='120' width='100' height='60' rx='2' fill='none' stroke='#8b9499' stroke-width='2' stroke-dasharray='6 4'/>
<text x='540' y='102' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>red: pad over a neighbor's top</text>
<text x='540' y='206' font-size='13' text-anchor='middle' font-weight='400' fill='#1d2326'>three B boxes 0.20 × 0.20 with 1 cm gaps</text>
<text x='540' y='226' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>risk 0.15: 2.5 cm of pad on each neighbor, may lift two boxes</text>
