<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 560' width='760' height='560' role='img' aria-label='ros2_control stack' font-family='Roboto, Helvetica, Arial, sans-serif' font-size='13'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8b9499'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#646d72'/></marker></defs>
<rect width='760' height='560' fill='white'/>
<text x='24' y='28' font-size='15' text-anchor='start' font-weight='600' fill='#1d2326'>A trajectory goes down to the hardware plugin; joint states come back up to TF</text>
<path d='M260 152.0V176.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M260 248.0V272.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M260 344.0V368.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M260 440.0V464.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M420.0 308H480.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<rect x='100.0' y='80.0' width='320' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='260' y='104' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>MoveIt or your code</text><text x='260' y='122' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>sends a trajectory as a FollowJointTrajectory</text><text x='260' y='138' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>action goal (joint names, points, times)</text>
<rect x='100.0' y='176.0' width='320' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='260' y='200' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>joint_trajectory_controller</text><text x='260' y='218' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>interpolates between points every cycle</text><text x='260' y='234' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>writes a position command per joint</text>
<rect x='100.0' y='272.0' width='320' height='72' rx='8' fill='#e76125' fill-opacity='0.12' stroke='#e76125' stroke-width='2'/><text x='260' y='296' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>controller_manager</text><text x='260' y='314' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>real-time loop at update_rate (100 Hz here):</text><text x='260' y='330' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>read → update controllers → write</text>
<rect x='100.0' y='368.0' width='320' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='260' y='392' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>hardware interface plugin</text><text x='260' y='410' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>mock_components/GenericSystem (this tutorial)</text><text x='260' y='426' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>ur_robot_driver on a real UR</text>
<rect x='100.0' y='464.0' width='320' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='260' y='488' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>6 joints declared in the URDF</text><text x='260' y='506' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>position command interface each</text><text x='260' y='522' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>position + velocity state interfaces each</text>
<rect x='480.0' y='272.0' width='240' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='600' y='296' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>joint_state_broadcaster</text><text x='600' y='314' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>publishes /joint_states</text><text x='600' y='330' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>→ robot_state_publisher → /tf</text>
<text x='268' y='168.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#646d72'>FollowJointTrajectory action</text>
<text x='268' y='264.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#646d72'>controller interface</text>
<text x='268' y='360.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#646d72'>read() / write()</text>
<text x='268' y='456.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#646d72'>state and command values</text>
<text x='450.0' y='266.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>state interfaces</text>
</svg>
