<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' width='760' height='300' role='img' aria-label='Detection pipeline' font-family='Roboto, Helvetica, Arial, sans-serif' font-size='13'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8b9499'/></marker><marker id='ag' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#646d72'/></marker></defs>
<rect width='760' height='300' fill='white'/>
<text x='24' y='28' font-size='15' text-anchor='start' font-weight='600' fill='#1d2326'>From point cloud to box poses in six steps; the height map is the pivot</text>
<path d='M236.0 120H272.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M488.0 120H524.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M632 156.0V180.0H128V204.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M236.0 240H272.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<path d='M488.0 240H524.0' fill='none' stroke='#8b9499' stroke-width='1.25' marker-end='url(#a)'/>
<rect x='20.0' y='84.0' width='216' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='128' y='108' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>1 · Transform</text><text x='128' y='126' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>cloud → pallet_frame via TF</text><text x='128' y='142' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>z becomes height above the deck</text>
<rect x='272.0' y='84.0' width='216' height='72' rx='8' fill='#e76125' fill-opacity='0.12' stroke='#e76125' stroke-width='2'/><text x='380' y='108' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>2 · Height map</text><text x='380' y='126' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>1 cm grid over the deck</text><text x='380' y='142' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>cell value = max z of its points</text>
<rect x='524.0' y='84.0' width='216' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='632' y='108' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>3 · Top-layer mask</text><text x='632' y='126' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>all points within 3 cm of the max</text><text x='632' y='142' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>opened 3 × 3 to cut thin bridges</text>
<rect x='20.0' y='204.0' width='216' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='128' y='228' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>4 · Connected components</text><text x='128' y='246' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>cv::connectedComponents on the mask</text><text x='128' y='262' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>one blob is one box top</text>
<rect x='272.0' y='204.0' width='216' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='380' y='228' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>5 · Rectangle fit</text><text x='380' y='246' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>cv::minAreaRect per blob</text><text x='380' y='262' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>→ center, size, yaw, fill ratio</text>
<rect x='524.0' y='204.0' width='216' height='72' rx='8' fill='none' stroke='#8b9499' stroke-width='1.25'/><text x='632' y='228' font-size='13' text-anchor='middle' font-weight='600' fill='#1d2326'>6 · Publish</text><text x='632' y='246' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>Detection3DArray on /detections</text><text x='632' y='262' font-size='11.5' text-anchor='middle' font-weight='400' fill='#646d72'>plus debug markers for RViz</text>
</svg>
